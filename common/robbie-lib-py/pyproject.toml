[project]
name = "robbie-lib"
version = "0.1.0"
description = "Common Robbie code any service can use. Rust port: ../robbie-lib-rs"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
relm = "relm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
